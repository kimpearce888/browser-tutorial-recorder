<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browser Tutorial Recorder</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-page="popup">
  <header class="popup-header">
    <img src="icons/icon-32.png" alt="" width="20" height="20" />
    <h1>Tutorial Recorder</h1>
  </header>

  <main id="main">
    <section id="status-card" class="card status-card hidden">
      <div class="status-row">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Recording</span>
        <span id="status-timer" class="timer">0:00</span>
      </div>
      <div class="meta-row">
        <span id="step-count">0 steps</span>
        <span id="tab-count"></span>
      </div>
      <div id="paused-note" class="note hidden">Paused — press Resume to continue.</div>
      <div id="capture-warn" class="note warn hidden">Screenshots are being blocked. Remove the extension in chrome://extensions and load it again so Chrome grants capture permission.</div>
    </section>

    <section id="idle-card" class="card muted-card">
      <p>Ready to record your workflow as a step-by-step tutorial.</p>
    </section>

    <div class="actions">
      <button id="btn-start" class="btn primary">Start recording</button>
      <button id="btn-pause" class="btn hidden">Pause</button>
      <button id="btn-resume" class="btn hidden">Resume</button>
      <button id="btn-stop" class="btn danger hidden">Stop &amp; save</button>
      <button id="btn-discard" class="btn ghost hidden">Discard</button>
    </div>
    <p id="error-line" class="error hidden"></p>
  </main>

  <footer class="popup-footer">
    <button id="nav-dashboard" class="link-btn">Dashboard</button>
    <button id="nav-settings" class="link-btn">Settings</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
