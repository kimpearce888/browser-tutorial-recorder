<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Preview — Browser Tutorial Recorder</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="preview.css" />
</head>
<body data-page="preview">
  <header class="topbar">
    <h1 id="tutorial-title">Preview</h1>
    <nav>
      <button id="btn-editor" class="btn small">Edit</button>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main>
    <section id="mode-bar" class="mode-bar">
      <button id="mode-guide" class="btn small active">Guide mode</button>
      <button id="mode-watch" class="btn small">Watch mode</button>
      <span id="progress" class="muted"></span>
    </section>

    <article class="step-view">
      <div id="step-image" class="step-image"></div>
      <p id="step-description" class="step-description"></p>
      <p id="step-url" class="step-url"></p>
    </article>

    <div class="controls">
      <button id="btn-prev" class="btn">← Previous</button>
      <button id="btn-next" class="btn primary">Next →</button>
    </div>
  </main>

  <script type="module" src="preview.js"></script>
</body>
</html>
