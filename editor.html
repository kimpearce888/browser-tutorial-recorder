<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Editor — Browser Tutorial Recorder</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="editor.css" />
</head>
<body data-page="editor">
  <header class="editor-topbar">
    <button id="btn-dashboard" class="btn ghost" title="Back to dashboard (Ctrl+Shift+H)">← Dashboard</button>
    <input id="tutorial-title" class="title-input" placeholder="Tutorial title" aria-label="Tutorial title" />
    <span id="save-state" class="save-state" aria-live="polite"></span>
    <button id="btn-preview" class="btn">Preview</button>
    <div class="export-wrap">
      <button id="btn-export" class="btn primary">Export ▾</button>
      <div id="export-menu" class="menu hidden">
        <button data-kind="html">Standalone HTML</button>
        <button data-kind="pdf">PDF / Print</button>
        <button data-kind="gif">Animated GIF</button>
        <button data-kind="markdown">Markdown</button>
        <button data-kind="png">PNG (current step)</button>
        <button data-kind="json">JSON</button>
        <button data-kind="text">Plain text</button>
      </div>
    </div>
  </header>

  <main class="editor-layout">
    <aside class="steps-pane">
      <div class="pane-head">
        <h2>Steps</h2>
        <span id="step-count-label" class="muted"></span>
      </div>
      <div id="step-list" class="step-list" role="listbox" aria-label="Tutorial steps"></div>
      <div class="steps-tools">
        <button id="btn-add-step" class="btn small">+ Add step</button>
      </div>
    </aside>

    <section class="canvas-pane">
      <div class="tool-bar" role="toolbar" aria-label="Annotation tools">
        <button class="tool" data-tool="select" title="Select / move (V)">⬉</button>
        <button class="tool" data-tool="highlight" title="Highlight (1)">▮</button>
        <button class="tool" data-tool="rectangle" title="Rectangle (2)">▭</button>
        <button class="tool" data-tool="circle" title="Circle (3)">◯</button>
        <button class="tool" data-tool="arrow" title="Arrow (4)">➔</button>
        <button class="tool" data-tool="text" title="Text (5)">T</button>
        <button class="tool" data-tool="blur" title="Blur (6)">▒</button>
        <button class="tool" data-tool="redaction" title="Redaction (7)">█</button>
        <button class="tool" data-tool="spotlight" title="Spotlight (8)">◍</button>
        <button class="tool" data-tool="marker" title="Numbered marker (9)">➉</button>
        <span class="tool-sep"></span>
        <button id="btn-undo" class="btn small" title="Undo">↶</button>
        <button id="btn-redo" class="btn small" title="Redo">↷</button>
        <button id="btn-copy-annotation" class="btn small" title="Copy selected annotation (Ctrl+C)">⧉</button>
        <button id="btn-paste-annotation" class="btn small" title="Paste annotation (Ctrl+V)">⎘</button>
        <button id="btn-delete-annotation" class="btn small" title="Delete selected annotation">🗑</button>
      </div>
      <div class="style-bar">
        <div class="swatches" id="swatches"></div>
        <label class="style-field">Stroke <input id="style-stroke" type="range" min="1" max="16" value="3" /></label>
        <label class="style-field">Opacity <input id="style-opacity" type="range" min="10" max="100" value="90" /></label>
        <label class="style-field">Blur <input id="style-blur" type="range" min="2" max="40" value="10" /></label>
        <label class="style-field">Font <input id="style-font" type="range" min="10" max="48" value="18" /></label>
        <span class="flex-spacer"></span>
        <button id="btn-save-preset" class="btn small ghost">Save preset</button>
        <div id="preset-chips" class="preset-chips"></div>
      </div>
      <div id="canvas-wrap" class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="crop-bar" class="crop-bar hidden" role="group" aria-label="Crop actions">
          <span class="crop-hint">Drag a rectangle, then apply</span>
          <button id="btn-crop-apply" class="btn small primary" disabled>Apply crop</button>
          <button id="btn-crop-cancel" class="btn small ghost">Cancel</button>
        </div>
        <input id="text-input" class="text-input hidden" placeholder="Type text, press Enter" />
        <p id="canvas-empty" class="canvas-empty hidden">This step has no screenshot yet. Recapture or delete it.</p>
      </div>
    </section>

    <aside class="props-pane">
      <h2>Step <span id="prop-step-number">–</span></h2>
      <label class="field">Description
        <textarea id="prop-description" rows="3"></textarea>
      </label>
      <label class="field">Page URL
        <input id="prop-url" type="text" readonly />
      </label>
      <div class="field">
        <span class="field-label">Screenshot</span>
        <div id="shot-info" class="muted small">–</div>
        <div class="row">
          <button id="btn-recapture-viewport" class="btn small">Recapture view</button>
          <button id="btn-recapture-full" class="btn small">Recapture full page</button>
        </div>
        <p class="muted small">Recapture opens the page in a tab for a moment.</p>
      </div>
      <h2>Step tools</h2>
      <div class="row wrap">
        <button id="btn-crop" class="btn small">Crop</button>
        <button id="btn-merge" class="btn small">Merge with next</button>
        <button id="btn-split" class="btn small">Split</button>
        <button id="btn-duplicate" class="btn small">Duplicate</button>
        <button id="btn-delete-step" class="btn small danger">Delete step</button>
      </div>
    </aside>
  </main>

  <script type="module" src="editor.js"></script>
</body>
</html>
