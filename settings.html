<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings — Browser Tutorial Recorder</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body data-page="settings">
  <header class="topbar">
    <h1>Settings</h1>
    <nav>
      <a href="dashboard.html">← Dashboard</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Recording</h2>
      <label class="field">Capture delay after each action
        <div class="inline"><input id="capture-delay" type="range" min="0" max="3000" step="50" /><span id="capture-delay-val"></span></div>
      </label>
      <label class="field">Screenshot format
        <select id="shot-format">
          <option value="png">PNG (lossless, larger)</option>
          <option value="jpeg">JPEG (smaller)</option>
        </select>
      </label>
      <label class="field" id="quality-field">JPEG quality
        <div class="inline"><input id="shot-quality" type="range" min="30" max="100" /><span id="shot-quality-val"></span></div>
      </label>
      <label class="field">Auto-pause after idle (seconds, 0 = off)
        <input id="idle-timeout" type="number" min="0" max="600" />
      </label>
      <label class="field">Excluded domains (recording auto-pauses here; one per line)
        <textarea id="excluded" rows="4" placeholder="mail.example.com&#10;bank.example.com"></textarea>
      </label>
      <label class="field">Sensitive field keywords (fields whose name/id matches are masked; one per line)
        <textarea id="sensitive" rows="4"></textarea>
      </label>
    </section>

    <section class="card">
      <h2>Appearance</h2>
      <label class="field">Theme
        <select id="theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="check"><input id="high-contrast" type="checkbox" /> High contrast</label>
      <label class="field">GIF frame delay
        <div class="inline"><input id="gif-delay" type="range" min="100" max="2000" step="100" /><span id="gif-delay-val"></span></div>
      </label>
      <label class="field">Preview auto-advance delay
        <div class="inline"><input id="preview-delay" type="range" min="500" max="10000" step="250" /><span id="preview-delay-val"></span></div>
      </label>
    </section>

    <section class="card">
      <h2>Editor shortcuts</h2>
      <p class="muted small">Click a shortcut, press the new combination. Conflicts are highlighted.</p>
      <div id="shortcut-list" class="shortcut-list"></div>
    </section>

    <section class="card">
      <h2>Storage</h2>
      <p id="storage-info" class="muted">–</p>
      <div class="row wrap">
        <button id="btn-export-all" class="btn small">Export all tutorials</button>
        <label class="btn small file-label">Import tutorials<input id="import-file" type="file" accept="application/json" multiple hidden /></label>
        <button id="btn-delete-all" class="btn small danger">Delete all tutorials</button>
      </div>
    </section>
  </main>

  <script type="module" src="settings.js"></script>
</body>
</html>
