<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tutorials — Browser Tutorial Recorder</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body data-page="dashboard">
  <header class="topbar">
    <h1>Tutorials</h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search tutorials…" autocomplete="off" />
      <select id="sort" aria-label="Sort">
        <option value="updated-desc">Recently updated</option>
        <option value="updated-asc">Oldest updated</option>
        <option value="title-asc">Title A–Z</option>
        <option value="title-desc">Title Z–A</option>
        <option value="steps-desc">Most steps</option>
      </select>
      <button id="view-toggle" class="btn ghost" title="Toggle view">▦ Grid</button>
    </div>
  </header>

  <div id="bulkbar" class="bulkbar hidden">
    <span id="bulk-count">0 selected</span>
    <button id="bulk-export" class="btn small">Export selected</button>
    <button id="bulk-delete" class="btn small danger">Delete selected</button>
    <button id="bulk-clear" class="btn small ghost">Clear</button>
  </div>

  <main id="list" class="grid" aria-live="polite"></main>

  <p id="empty" class="empty hidden">
    No tutorials yet. Click the toolbar icon and press <strong>Start recording</strong>.
  </p>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
